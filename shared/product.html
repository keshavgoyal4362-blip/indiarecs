<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Loading... | IndiaRecs</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="stylesheet" href="/shared/nav.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', sans-serif !important; }
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1a1a1a;
      --border: #222;
      --text: #f5f5f5;
      --text-dim: #999;
      --text-muted: #666;
      --accent: #ff6b35;
      --positive: #06b96f;
      --negative: #e94560;
      --amber: #f59e0b;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    html, body { overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

    /* Breadcrumb */
    .breadcrumb { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 6px; color: var(--text-muted); }

    /* Product Hero */
    .product-hero { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; margin-bottom: 40px; }
    @media (max-width: 768px) { .product-hero { grid-template-columns: 1fr; } }

    .product-image { display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; min-height: 300px; }
    .product-image img { width: 100%; max-width: 320px; border-radius: 12px; object-fit: contain; }

    .product-info h1 { font-size: 28px; margin-bottom: 8px; line-height: 1.2; }
    .product-info .brand { font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }
    .product-info .price { font-size: 22px; font-weight: 700; color: var(--positive); margin-bottom: 16px; }
    .product-info .description { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }

    .product-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .product-tag { padding: 5px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--text-dim); }

    /* Sentiment */
    .sentiment-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 28px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .sentiment-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .sentiment-emoji { font-size: 16px; width: 24px; }
    .sentiment-bar-wrap { flex: 1; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
    .sentiment-bar-fill { height: 100%; border-radius: 5px; }
    .sentiment-bar-fill.pos { background: var(--positive); }
    .sentiment-bar-fill.neu { background: var(--amber); }
    .sentiment-bar-fill.neg { background: var(--negative); }
    .sentiment-label { font-size: 13px; color: var(--text-dim); min-width: 90px; text-align: right; }
    .sentiment-label strong { color: var(--text); }

    /* Pros & Cons */
    .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 768px) { .pros-cons { grid-template-columns: 1fr; } }
    .pc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .pc-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: bold; margin-bottom: 14px; }
    .pc-title.pros { color: var(--positive); }
    .pc-title.cons { color: var(--negative); }
    .pc-item { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 10px; padding-left: 18px; position: relative; }
    .pc-item::before { content: ""; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; }
    .pc-item.pro::before { background: var(--positive); }
    .pc-item.con::before { background: var(--negative); }
    .pc-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }

    /* Retailer */
    .retailers-section { margin-bottom: 28px; }
    .retailers-grid { display: grid; grid-template-columns: minmax(140px, 220px); gap: 10px; }
    .retailer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; transition: border-color 0.15s; }
    .retailer-card:hover { border-color: var(--accent); }
    .retailer-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    .retailer-action { font-size: 12px; color: var(--text-dim); }
    .retailer-card:hover .retailer-action { color: var(--accent); }

    /* Recommendations */
    .recs-section { margin-bottom: 28px; }
    .recs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .rec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; transition: border-color 0.15s; }
    .rec-card:hover { border-color: var(--accent); }
    .rec-card img { width: 100%; max-width: 120px; height: 120px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
    .rec-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .rec-price { font-size: 13px; color: var(--positive); font-weight: 500; }

    /* Reddit Comments */
    .comments-section { margin-bottom: 28px; }
    .comments-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
    .comments-header h2 { font-size: 16px; font-weight: bold; }
    .comments-count { font-size: 13px; color: var(--text-dim); }
    .comments-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .comment-filter-btn { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: bold; background: var(--surface); border: 1px solid var(--border); color: var(--text-dim); cursor: pointer; transition: all 0.15s; }
    .comment-filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .comment-filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .comment-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; transition: border-color 0.15s; }
    .comment-card:hover { border-color: rgba(255, 107, 53, 0.3); }
    .comment-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .comment-subreddit { font-size: 12px; font-weight: bold; color: var(--accent); background: rgba(255, 107, 53, 0.1); padding: 3px 10px; border-radius: 999px; }
    .comment-sentiment { font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
    .comment-sentiment.positive { color: var(--positive); background: rgba(6, 185, 111, 0.12); }
    .comment-sentiment.negative { color: var(--negative); background: rgba(233, 69, 96, 0.12); }
    .comment-sentiment.neutral { color: var(--amber); background: rgba(245, 158, 11, 0.12); }
    .comment-user { font-size: 12px; color: var(--text-muted); }
    .comment-time { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .comment-text { font-size: 14px; color: var(--text); line-height: 1.65; }
    .comment-text-clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .comment-read-more { font-size: 12px; color: var(--accent); font-weight: bold; cursor: pointer; display: inline-block; }
    .comment-read-more:hover { text-decoration: underline; }

    .comment-footer { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
    .comment-source-link { font-size: 12px; color: var(--text-muted); font-weight: 500; transition: color 0.15s; margin-left: auto; }
    .comment-source-link:hover { color: var(--accent); text-decoration: underline; }

    .comments-load-more { display: block; width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: bold; color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-align: center; margin-top: 8px; }
    .comments-load-more:hover { border-color: var(--accent); color: var(--text); }

    .comments-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }

    /* States */
    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }
    .error { text-align: center; padding: 60px 20px; color: var(--negative); font-size: 15px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Shared nav -->
<nav id="mainNav"></nav>

<main class="container">
  <!-- Breadcrumb -->
  <nav class="breadcrumb" id="breadcrumb">
    <a href="/">Home</a>
  </nav>

  <!-- Loading state -->
  <div class="loading" id="loading">Loading product...</div>

  <!-- Error state -->
  <div class="error" id="error" style="display:none;"></div>

  <!-- Product content (hidden until loaded) -->
  <article id="product-content" style="display:none;">

    <section class="product-hero">
      <div class="product-image">
        <img id="product-img" src="" alt="" />
      </div>
      <div class="product-info">
        <h1 id="product-name"></h1>
        <p class="brand" id="product-brand"></p>
        <p class="price" id="product-price"></p>
        <div class="product-tags" id="product-tags"></div>
        <div class="description" id="product-description"></div>
      </div>
    </section>

    <!-- Retailer -->
    <section class="retailers-section" id="retailers-section">
      <h2 class="section-title">Where to Buy</h2>
      <div class="retailers-grid" id="retailers-grid"></div>
    </section>

    <!-- Sentiment -->
    <section class="sentiment-section" id="sentiment-section" style="display:none;">
      <h2 class="section-title">Reddit Sentiment</h2>
      <div id="sentiment-bars"></div>
    </section>

    <!-- Pros & Cons -->
    <section class="pros-cons" id="pros-cons-section" style="display:none;">
      <div class="pc-card">
        <div class="pc-title pros">Top Pros</div>
        <div id="pros-list"></div>
      </div>
      <div class="pc-card">
        <div class="pc-title cons">Top Cons</div>
        <div id="cons-list"></div>
      </div>
    </section>

    <!-- Reddit Comments -->
    <section class="comments-section" id="comments-section" style="display:none;">
      <div class="comments-header">
        <div>
          <h2>What Reddit Says</h2>
          <span class="comments-count" id="comments-count"></span>
        </div>
        <div class="comments-filters" id="comments-filters">
          <button class="comment-filter-btn active" data-filter="all">All</button>
          <button class="comment-filter-btn" data-filter="positive">Positive</button>
          <button class="comment-filter-btn" data-filter="negative">Negative</button>
        </div>
      </div>
      <div id="comments-list"></div>
      <button class="comments-load-more" id="comments-load-more" style="display:none;">
        Show more comments
      </button>
    </section>

    <!-- Recommendations -->
    <section class="recs-section" id="recs-section" style="display:none;">
      <h2 class="section-title">You Might Also Like</h2>
      <div class="recs-grid" id="recs-grid"></div>
    </section>

  </article>
</main>

<!-- Mobile menu container for shared nav -->
<div id="mobileMenuContainer"></div>
<script src="/shared/nav.js"></script>
  <!-- Code Generated by Sidekick is for learning and experimentation purposes only. -->
<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  var SUPABASE_URL = 'https://hrhhznjfpstwuxdlwyhz.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyaGh6bmpmcHN0d3V4ZGx3eWh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MDA0MTIsImV4cCI6MjA5MzQ3NjQxMn0.MwCj_Z3KbhEpgYHckmFK0IRiCkSEoN_wMQdcHk4L-NU';
  var supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  var pathParts = window.location.pathname.split('/').filter(Boolean);
  var categorySlug = pathParts[0] || '';
  var subcategorySlug = pathParts[1] || '';
  var productSlug = pathParts[2] || '';

  function prettyName(s) {
    return s.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
  }

function escapeHtml(s) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(s || ''));
  return div.innerHTML;
}


  function timeAgo(d) {
    if (!d) return '';
    var ms = Date.now() - new Date(d).getTime();
    var m = Math.floor(ms / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var dd = Math.floor(h / 24);
    if (dd < 7) return dd + 'd ago';
    if (dd < 30) return Math.floor(dd / 7) + 'w ago';
    return Math.floor(dd / 30) + 'mo ago';
  }

  function renderBreadcrumb(productName) {
    document.getElementById('breadcrumb').innerHTML =
      '<a href="/">Home</a><span class="sep">\u203A</span>' +
      '<a href="/' + categorySlug + '/' + subcategorySlug + '">' + prettyName(subcategorySlug) + '</a>' +
      '<span class="sep">\u203A</span>' +
      '<span>' + escapeHtml(productName) + '</span>';
  }

  var allComments = [];
  var currentFilter = 'all';
  var visibleCount = 8;
  var COMMENTS_PER_PAGE = 8;

  async function fetchProduct() {
    if (!productSlug) { showError('No product specified in URL.'); return; }

    try {
      var result = await supabase.from('products').select('*').eq('slug', productSlug).limit(1);
      if (result.error) throw result.error;
      if (!result.data || result.data.length === 0) {
        showError('Product not found.');
        return;
      }
      var product = result.data[0];
      renderProduct(product);
      fetchRecommendations(product);
      fetchComments(product.name);
    } catch (err) {
      console.error('Fetch error:', err);
      showError('Something went wrong loading this product.');
    }
  }

  function renderProduct(p) {
    document.getElementById('page-title').textContent = p.name + ' | IndiaRecs';
    document.getElementById('meta-description').content = p.description || (p.name + ' - Reddit reviews');
    renderBreadcrumb(p.name);

    var img = document.getElementById('product-img');
    if (p.image_url && p.image_url.indexOf('data:') !== 0) {
      img.src = p.image_url;
      img.alt = p.name;
    } else {
      var initial = (p.name || '?').charAt(0).toUpperCase();
      img.parentElement.innerHTML = '<div style="width:200px;height:200px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff6b35,#a855f7);">' + initial + '</div>';
    }

    document.getElementById('product-name').textContent = p.name;
    document.getElementById('product-brand').textContent = p.brand ? 'by ' + p.brand : '';
    document.getElementById('product-price').textContent = p.price_inr ? '\u20B9' + p.price_inr : '';
    document.getElementById('product-description').textContent = p.description || '';

    var tagsEl = document.getElementById('product-tags');
    var tags = [];
    if (p.product_category) tags.push(p.product_category);
    if (p.skin_type) tags.push(p.skin_type + ' skin');
    if (p.tags && Array.isArray(p.tags)) tags = tags.concat(p.tags);
    tagsEl.innerHTML = tags.map(function(t) { return '<span class="product-tag">' + escapeHtml(t) + '</span>'; }).join('');

    var q = encodeURIComponent(p.name);
    var amazonUrl = p.affiliate_url ? p.affiliate_url : 'https://www.amazon.in/s?k=' + q + '&tag=indiarecs-21';
    document.getElementById('retailers-grid').innerHTML =
      '<a href="' + amazonUrl + '" target="_blank" rel="noopener" class="retailer-card">' +
      '<div class="retailer-name">Amazon India</div>' +
      '<div class="retailer-action">Check price \u2192</div></a>';

    var total = p.mention_count || 0;
    var pos = p.positive_count || 0;
    var neg = p.negative_count || 0;
    var neu = Math.max(0, total - pos - neg);
    var denom = pos + neu + neg;

    if (denom > 0) {
      document.getElementById('sentiment-section').style.display = 'block';
      var posPct = Math.round((pos / denom) * 100);
      var neuPct = Math.round((neu / denom) * 100);
      var negPct = Math.round((neg / denom) * 100);
      document.getElementById('sentiment-bars').innerHTML =
        '<div class="sentiment-row"><span class="sentiment-emoji">\uD83D\uDC4D</span><div class="sentiment-bar-wrap"><div class="sentiment-bar-fill pos" style="width:' + posPct + '%"></div></div><span class="sentiment-label"><strong>' + pos + '</strong> (' + posPct + '%)</span></div>' +
        '<div class="sentiment-row"><span class="sentiment-emoji">\uD83D\uDE10</span><div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neu" style="width:' + neuPct + '%"></div></div><span class="sentiment-label"><strong>' + neu + '</strong> (' + neuPct + '%)</span></div>' +
        '<div class="sentiment-row"><span class="sentiment-emoji">\uD83D\uDC4E</span><div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neg" style="width:' + negPct + '%"></div></div><span class="sentiment-label"><strong>' + neg + '</strong> (' + negPct + '%)</span></div>' +
        '<div style="margin-top:12px;font-size:12px;color:var(--text-muted);">Based on ' + total + ' Reddit mention' + (total === 1 ? '' : 's') + '</div>';
    }

    var pros = (p.pros || '').split('\n').filter(function(x) { return x.trim(); });
    var cons = (p.cons || '').split('\n').filter(function(x) { return x.trim(); });

    if (pros.length > 0 || cons.length > 0) {
      document.getElementById('pros-cons-section').style.display = 'grid';
      document.getElementById('pros-list').innerHTML = pros.length > 0
        ? pros.map(function(item) { return '<div class="pc-item pro">' + escapeHtml(item) + '</div>'; }).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
      document.getElementById('cons-list').innerHTML = cons.length > 0
        ? cons.map(function(item) { return '<div class="pc-item con">' + escapeHtml(item) + '</div>'; }).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('product-content').style.display = 'block';
  }

  async function fetchComments(productName) {
    try {
      var result = await supabase.from('mentions').select('*').eq('product_name', productName).order('created_at', { ascending: false });
      if (result.error) throw result.error;
      if (!result.data || result.data.length === 0) return;
      allComments = result.data;
      renderCommentsSection();
    } catch (err) {
      console.error('Comments fetch error:', err);
    }
  }

  function renderCommentsSection() {
    if (allComments.length === 0) return;
    document.getElementById('comments-section').style.display = 'block';
    document.getElementById('comments-count').textContent = allComments.length + ' mention' + (allComments.length === 1 ? '' : 's') + ' found';
    setupCommentFilters();
    renderCommentsList();
  }

  function setupCommentFilters() {
    var filterBtns = document.querySelectorAll('.comment-filter-btn');
    filterBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        filterBtns.forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        visibleCount = COMMENTS_PER_PAGE;
        renderCommentsList();
      });
    });
  }

  function getFilteredComments() {
    if (currentFilter === 'all') return allComments;
    return allComments.filter(function(c) { return (c.sentiment || '').toLowerCase() === currentFilter; });
  }

  function renderCommentsList() {
    var filtered = getFilteredComments();
    var toShow = filtered.slice(0, visibleCount);
    var listEl = document.getElementById('comments-list');

    if (filtered.length === 0) {
      listEl.innerHTML = '<div class="comments-empty">No ' + currentFilter + ' comments found yet.</div>';
      document.getElementById('comments-load-more').style.display = 'none';
      return;
    }

    listEl.innerHTML = toShow.map(function(c, i) {
      var text = c.comment_text || '';
      var isLong = text.length > 280;
      var sentiment = (c.sentiment || 'neutral').toLowerCase();
      var sentimentLabel = sentiment === 'positive' ? 'Positive' : sentiment === 'negative' ? 'Negative' : 'Neutral';
      var subredditHtml = c.subreddit ? '<span class="comment-subreddit">r/' + escapeHtml(c.subreddit) + '</span>' : '';
      var userHtml = (c.username && c.username.indexOf('legacy_') !== 0) ? '<span class="comment-user">u/' + escapeHtml(c.username) + '</span>' : '';
      var redditLink = c.reddit_url ? '<a href="' + escapeHtml(c.reddit_url) + '" target="_blank" rel="noopener" class="comment-source-link">View on Reddit</a>' : '';
      var readMore = isLong ? '<span class="comment-read-more" data-index="' + i + '">Read more</span>' : '';

      return '<div class="comment-card">' +
        '<div class="comment-meta">' + subredditHtml +
        '<span class="comment-sentiment ' + sentiment + '">' + sentimentLabel + '</span>' +
        userHtml +
        '<span class="comment-time">' + timeAgo(c.created_at) + '</span></div>' +
        '<div class="comment-text ' + (isLong ? 'comment-text-clamped' : '') + '" id="comment-text-' + i + '">' + escapeHtml(text) + '</div>' +
        '<div class="comment-footer">' + readMore + redditLink + '</div></div>';
    }).join('');

    document.querySelectorAll('.comment-read-more').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = btn.getAttribute('data-index');
        var el = document.getElementById('comment-text-' + idx);
        if (el.classList.contains('comment-text-clamped')) {
          el.classList.remove('comment-text-clamped');
          btn.textContent = 'Show less';
        } else {
          el.classList.add('comment-text-clamped');
          btn.textContent = 'Read more';
        }
      });
    });

    var loadMoreBtn = document.getElementById('comments-load-more');
    if (filtered.length > visibleCount) {
      loadMoreBtn.style.display = 'block';
      loadMoreBtn.textContent = 'Show more (' + (filtered.length - visibleCount) + ' remaining)';
    } else {
      loadMoreBtn.style.display = 'none';
    }
  }

  document.getElementById('comments-load-more').addEventListener('click', function() {
    visibleCount += COMMENTS_PER_PAGE;
    renderCommentsList();
  });

  async function fetchRecommendations(currentProduct) {
    try {
      var result = await supabase
        .from('products')
        .select('name, slug, image_url, price_inr, category, product_category, brand')
        .eq('product_category', currentProduct.product_category || '')
        .neq('slug', productSlug)
        .order('mention_count', { ascending: false })
        .limit(4);

      if (result.error || !result.data || result.data.length === 0) return;

      var grid = document.getElementById('recs-grid');
      grid.innerHTML = result.data.map(function(rec) {
        var recUrl = '/' + (rec.category || categorySlug) + '/' + subcategorySlug + '/' + rec.slug;
        var hasImg = rec.image_url && rec.image_url.indexOf('data:') !== 0;
        var imgHtml = hasImg
          ? '<img src="' + rec.image_url + '" alt="' + escapeHtml(rec.name) + '" />'
          : '<div style="width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:white;background:linear-gradient(135deg,#06b96f,#3b82f6);margin:0 auto 10px;">' + (rec.name || '?').charAt(0).toUpperCase() + '</div>';

        return '<a href="' + recUrl + '" class="rec-card">' + imgHtml +
          '<p class="rec-name">' + escapeHtml(rec.name) + '</p>' +
          '<p class="rec-price">' + (rec.price_inr ? '\u20B9' + rec.price_inr : '') + '</p></a>';
      }).join('');

      document.getElementById('recs-section').style.display = 'block';
    } catch (err) {
      console.error('Recs fetch error:', err);
    }
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    var errEl = document.getElementById('error');
    errEl.textContent = msg;
    errEl.style.display = 'block';
    renderBreadcrumb('Not Found');
  }

  fetchProduct();
</script>
</body>
</html>
