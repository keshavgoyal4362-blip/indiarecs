<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Loading... | IndiaRecs</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="stylesheet" href="/shared/nav.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', sans-serif !important; }
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface-2: #1a1a1a;
      --border: #222;
      --text: #f5f5f5;
      --text-dim: #999;
      --text-muted: #666;
      --accent: #ff6b35;
      --positive: #06b96f;
      --negative: #e94560;
      --amber: #f59e0b;
    }
    html, body { overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    .container { max-width: 900px; margin: 0 auto; padding: 24px 20px 60px; }

    /* Breadcrumb */
    .breadcrumb { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
    .breadcrumb a { color: var(--accent); }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 6px; color: var(--text-muted); }

    /* Product Hero */
    .product-hero { display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; margin-bottom: 40px; }
    @media (max-width: 768px) { .product-hero { grid-template-columns: 1fr; } }

    .product-image { display: flex; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; min-height: 300px; }
    .product-image img { width: 100%; max-width: 320px; border-radius: 12px; object-fit: contain; }

    .product-info h1 { font-size: 28px; margin-bottom: 8px; line-height: 1.2; }
    .product-info .brand { font-size: 15px; color: var(--text-dim); margin-bottom: 16px; }
    .product-info .price { font-size: 22px; font-weight: 700; color: var(--positive); margin-bottom: 16px; }
    .product-info .description { color: var(--text-dim); font-size: 14px; line-height: 1.7; margin-bottom: 20px; }

    .product-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .product-tag { padding: 5px 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--text-dim); }

    .buy-btn { display: inline-block; padding: 12px 28px; background: var(--accent); color: white; font-weight: 700; border-radius: 10px; font-size: 14px; transition: opacity 0.15s; }
    .buy-btn:hover { opacity: 0.85; }

    /* Sentiment */
    .sentiment-section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 28px; }
    .section-title { font-size: 16px; font-weight: bold; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .sentiment-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .sentiment-emoji { font-size: 16px; width: 24px; }
    .sentiment-bar-wrap { flex: 1; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
    .sentiment-bar-fill { height: 100%; border-radius: 5px; }
    .sentiment-bar-fill.pos { background: var(--positive); }
    .sentiment-bar-fill.neu { background: var(--amber); }
    .sentiment-bar-fill.neg { background: var(--negative); }
    .sentiment-label { font-size: 13px; color: var(--text-dim); min-width: 90px; text-align: right; }
    .sentiment-label strong { color: var(--text); }

    /* Pros & Cons */
    .pros-cons { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
    @media (max-width: 768px) { .pros-cons { grid-template-columns: 1fr; } }
    .pc-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
    .pc-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.7px; font-weight: bold; margin-bottom: 14px; }
    .pc-title.pros { color: var(--positive); }
    .pc-title.cons { color: var(--negative); }
    .pc-item { font-size: 14px; color: var(--text); line-height: 1.6; margin-bottom: 10px; padding-left: 18px; position: relative; }
    .pc-item::before { content: ""; position: absolute; left: 0; top: 8px; width: 8px; height: 8px; border-radius: 50%; }
    .pc-item.pro::before { background: var(--positive); }
    .pc-item.con::before { background: var(--negative); }
    .pc-empty { font-size: 13px; color: var(--text-muted); font-style: italic; }

    /* Retailers */
    .retailers-section { margin-bottom: 28px; }
    .retailers-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .retailer-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; transition: border-color 0.15s; }
    .retailer-card:hover { border-color: var(--accent); }
    .retailer-name { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
    .retailer-action { font-size: 12px; color: var(--text-dim); }
    .retailer-card:hover .retailer-action { color: var(--accent); }

    /* Recommendations */
    .recs-section { margin-bottom: 28px; }
    .recs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
    .rec-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; transition: border-color 0.15s; }
    .rec-card:hover { border-color: var(--accent); }
    .rec-card img { width: 100%; max-width: 120px; height: 120px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; }
    .rec-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .rec-price { font-size: 13px; color: var(--positive); font-weight: 500; }

    /* States */
    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }
    .error { text-align: center; padding: 60px 20px; color: var(--negative); font-size: 15px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<!-- Shared nav -->
<nav id="mainNav"></nav>

<main class="container">
  <!-- Breadcrumb -->
  <nav class="breadcrumb" id="breadcrumb">
    <a href="/">Home</a>
  </nav>

  <!-- Loading state -->
  <div class="loading" id="loading">Loading product...</div>

  <!-- Error state -->
  <div class="error" id="error" style="display:none;"></div>

  <!-- Product content (hidden until loaded) -->
  <article id="product-content" style="display:none;">

    <section class="product-hero">
      <div class="product-image">
        <img id="product-img" src="" alt="" />
      </div>
      <div class="product-info">
        <h1 id="product-name"></h1>
        <p class="brand" id="product-brand"></p>
        <p class="price" id="product-price"></p>
        <div class="product-tags" id="product-tags"></div>
        <div class="description" id="product-description"></div>
        <a class="buy-btn" id="buy-link" href="#" target="_blank" rel="noopener noreferrer nofollow">
          Search on Amazon →
        </a>
      </div>
    </section>

    <!-- Sentiment -->
    <section class="sentiment-section" id="sentiment-section" style="display:none;">
      <h2 class="section-title">Reddit Sentiment</h2>
      <div id="sentiment-bars"></div>
    </section>

    <!-- Pros & Cons -->
    <section class="pros-cons" id="pros-cons-section" style="display:none;">
      <div class="pc-card">
        <div class="pc-title pros">Top Pros</div>
        <div id="pros-list"></div>
      </div>
      <div class="pc-card">
        <div class="pc-title cons">Top Cons</div>
        <div id="cons-list"></div>
      </div>
    </section>

    <!-- Retailers -->
    <section class="retailers-section" id="retailers-section">
      <h2 class="section-title">Where to Buy</h2>
      <div class="retailers-grid" id="retailers-grid"></div>
    </section>

    <!-- Recommendations -->
    <section class="recs-section" id="recs-section" style="display:none;">
      <h2 class="section-title">You Might Also Like</h2>
      <div class="recs-grid" id="recs-grid"></div>
    </section>

  </article>
</main>

<!-- Mobile menu container for shared nav -->
<div id="mobileMenuContainer"></div>
<script src="/shared/nav.js"></script>

<script type="module">
  // ─── SUPABASE CLIENT (same approach as other pages) ─────────
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://hrhhznjfpstwuxdlwyhz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SG22UKcXlKJcDlX0QfEOiQ__0sCg5Lc';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ─── PARSE URL PATH ────────────────────────────────────────
  // e.g. /skincare/cleansers/cetaphil-gentle-cleanser
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const categorySlug = pathParts[0] || '';       // "skincare"
  const subcategorySlug = pathParts[1] || '';    // "cleansers"
  const productSlug = pathParts[2] || '';        // "cetaphil-gentle-cleanser"

  // Helper: slug → Display Name
  const prettyName = (s) =>
    s.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ─── BUILD BREADCRUMB ──────────────────────────────────────
  function renderBreadcrumb(productName) {
    document.getElementById('breadcrumb').innerHTML = `
      <a href="/">Home</a><span class="sep">›</span>
      <a href="/${categorySlug}/${subcategorySlug}">${prettyName(subcategorySlug)}</a><span class="sep">›</span>
      <span>${escapeHtml(productName)}</span>
    `;
  }

  // ─── FETCH PRODUCT ─────────────────────────────────────────
  async function fetchProduct() {
    if (!productSlug) {
      showError('No product specified in URL.');
      return;
    }

    try {
      // Query by slug column (which exists in your DB)
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .eq('slug', productSlug)
        .limit(1);

      if (error) throw error;

      if (!data || data.length === 0) {
        showError('Product not found. It may have been removed or the URL is incorrect.');
        return;
      }

      const product = data[0];
      renderProduct(product);
      fetchRecommendations(product);

    } catch (err) {
      console.error('Fetch error:', err);
      showError('Something went wrong loading this product. Please try again.');
    }
  }

  // ─── RENDER PRODUCT ────────────────────────────────────────
  function renderProduct(p) {
    // Page title & meta
    document.getElementById('page-title').textContent =
      `${p.name} — ${prettyName(subcategorySlug)} | IndiaRecs`;
    document.getElementById('meta-description').content =
      p.description || `${p.name} by ${p.brand || 'Unknown'} — Reddit sentiment and reviews`;

    // Breadcrumb
    renderBreadcrumb(p.name);

    // Image (with fallback)
    const img = document.getElementById('product-img');
    if (p.image_url && !p.image_url.startsWith('data:')) {
      // Only use image_url if it's a real URL, not a base64 blob
      img.src = p.image_url;
    } else {
      // Gradient fallback
      img.style.display = 'none';
      img.parentElement.innerHTML = `
        <div style="width:200px;height:200px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff6b35,#a855f7);">
          ${(p.name || '?').charAt(0).toUpperCase()}
        </div>`;
    }
    img.alt = p.name;

    // Text fields
    document.getElementById('product-name').textContent = p.name;
    document.getElementById('product-brand').textContent = p.brand ? `by ${p.brand}` : '';
    document.getElementById('product-price').textContent = p.price_inr
      ? `₹${p.price_inr}`
      : '';
    document.getElementById('product-description').textContent = p.description || '';

    // Tags
    const tagsEl = document.getElementById('product-tags');
    const tags = [];
    if (p.product_category) tags.push(p.product_category);
    if (p.skin_type) tags.push(p.skin_type + ' skin');
    if (p.tags && Array.isArray(p.tags)) tags.push(...p.tags);
    tagsEl.innerHTML = tags.map(t => `<span class="product-tag">${escapeHtml(t)}</span>`).join('');

    // Buy link (search Amazon for the product)
    const q = encodeURIComponent(p.name);
    document.getElementById('buy-link').href = `https://www.amazon.in/s?k=${q}`;

    // Sentiment
    const total = p.mention_count || 0;
    const pos = p.positive_count || 0;
    const neg = p.negative_count || 0;
    const neu = Math.max(0, total - pos - neg);
    const denom = pos + neu + neg;

    if (denom > 0) {
      document.getElementById('sentiment-section').style.display = 'block';
      const posPct = Math.round((pos / denom) * 100);
      const neuPct = Math.round((neu / denom) * 100);
      const negPct = Math.round((neg / denom) * 100);
      document.getElementById('sentiment-bars').innerHTML = `
        <div class="sentiment-row">
          <span class="sentiment-emoji">👍</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill pos" style="width:${posPct}%"></div></div>
          <span class="sentiment-label"><strong>${pos}</strong> (${posPct}%)</span>
        </div>
        <div class="sentiment-row">
          <span class="sentiment-emoji">😐</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neu" style="width:${neuPct}%"></div></div>
          <span class="sentiment-label"><strong>${neu}</strong> (${neuPct}%)</span>
        </div>
        <div class="sentiment-row">
          <span class="sentiment-emoji">👎</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neg" style="width:${negPct}%"></div></div>
          <span class="sentiment-label"><strong>${neg}</strong> (${negPct}%)</span>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-muted);">
          Based on ${total} Reddit mention${total === 1 ? '' : 's'} from Indian communities
        </div>
      `;
    }

    // Pros & Cons — stored as newline-separated TEXT, not arrays
    const pros = (p.pros || '').split('\n').filter(x => x.trim());
    const cons = (p.cons || '').split('\n').filter(x => x.trim());

    if (pros.length > 0 || cons.length > 0) {
      document.getElementById('pros-cons-section').style.display = 'grid';
      document.getElementById('pros-list').innerHTML = pros.length > 0
        ? pros.map(item => `<div class="pc-item pro">${escapeHtml(item)}</div>`).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
      document.getElementById('cons-list').innerHTML = cons.length > 0
        ? cons.map(item => `<div class="pc-item con">${escapeHtml(item)}</div>`).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
    }

    // Retailers
    document.getElementById('retailers-grid').innerHTML = `
      <a href="https://www.amazon.in/s?k=${q}" target="_blank" rel="noopener" class="retailer-card">
        <div class="retailer-name">Amazon</div>
        <div class="retailer-action">Find prices →</div>
      </a>
      <a href="https://www.nykaa.com/search/result/?q=${q}" target="_blank" rel="noopener" class="retailer-card">
        <div class="retailer-name">Nykaa</div>
        <div class="retailer-action">Find prices →</div>
      </a>
      <a href="https://www.flipkart.com/search?q=${q}" target="_blank" rel="noopener" class="retailer-card">
        <div class="retailer-name">Flipkart</div>
        <div class="retailer-action">Find prices →</div>
      </a>
      <a href="https://www.1mg.com/search/all?name=${q}" target="_blank" rel="noopener" class="retailer-card">
        <div class="retailer-name">Tata 1mg</div>
        <div class="retailer-action">Find prices →</div>
      </a>
    `;

    // Show content, hide loading
    document.getElementById('loading').style.display = 'none';
    document.getElementById('product-content').style.display = 'block';
  }

  // ─── FETCH RECOMMENDATIONS ─────────────────────────────────
  async function fetchRecommendations(currentProduct) {
    try {
      // Find other products in the same product_category (NOT "subcategory" — that column doesn't exist)
      const { data: recs, error } = await supabase
        .from('products')
        .select('name, slug, image_url, price_inr, category, product_category, brand')
        .eq('product_category', currentProduct.product_category || '')
        .neq('slug', productSlug)
        .order('score', { ascending: false })
        .limit(4);

      if (error || !recs || recs.length === 0) return;

      renderRecommendations(recs);
    } catch (err) {
      console.error('Recs fetch error:', err);
      // Fail silently — recs are non-critical
    }
  }

  // ─── RENDER RECOMMENDATIONS ────────────────────────────────
  function renderRecommendations(recs) {
    const grid = document.getElementById('recs-grid');

    grid.innerHTML = recs.map(rec => {
      // Build URL matching the Vercel rewrite pattern: /category/subcategory/slug
      const recUrl = `/${rec.category || categorySlug}/${subcategorySlug}/${rec.slug}`;
      const hasRealImage = rec.image_url && !rec.image_url.startsWith('data:');
      const imgHtml = hasRealImage
        ? `<img src="${rec.image_url}" alt="${escapeHtml(rec.name)}" />`
        : `<div style="width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:white;background:linear-gradient(135deg,#06b96f,#3b82f6);margin:0 auto 10px;">${(rec.name || '?').charAt(0).toUpperCase()}</div>`;

      return `
        <a href="${recUrl}" class="rec-card">
          ${imgHtml}
          <p class="rec-name">${escapeHtml(rec.name)}</p>
          <p class="rec-price">${rec.price_inr ? '₹' + rec.price_inr : ''}</p>
        </a>
      `;
    }).join('');

    document.getElementById('recs-section').style.display = 'block';
  }

  // ─── ERROR HANDLER ─────────────────────────────────────────
  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const errEl = document.getElementById('error');
    errEl.textContent = msg;
    errEl.style.display = 'block';
    // Still show breadcrumb even on error
    renderBreadcrumb('Not Found');
  }

  // ─── INIT ──────────────────────────────────────────────────
  fetchProduct();
</script>

</body>
</html>
