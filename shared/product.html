  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Trebuchet MS', 'Lucida Sans Unicode', sans-serif !important; }
    :root {

    .rec-card:hover { border-color: var(--accent); }

    .rec-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; line-height: 1.3; }
    .rec-price { font-size: 13px; color: var(--positive); font-weight: 500; }

    /* ─── Reddit Comments Section ─── */
    .comments-section { margin-bottom: 28px; }
    .comments-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }

    .comment-filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .comment-filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .comment-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; transition: border-color 0.15s; }
    .comment-card:hover { border-color: rgba(255, 107, 53, 0.3); }
    .comment-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .comment-subreddit { font-size: 12px; font-weight: bold; color: var(--accent); background: rgba(255, 107, 53, 0.1); padding: 3px 10px; border-radius: 999px; }
    .comment-sentiment { font-size: 11px; font-weight: bold; padding: 3px 10px; border-radius: 999px; }
    .comment-sentiment.positive { color: var(--positive); background: rgba(6, 185, 111, 0.12); }
    .comment-sentiment.negative { color: var(--negative); background: rgba(233, 69, 96, 0.12); }
    .comment-sentiment.neutral { color: var(--amber); background: rgba(245, 158, 11, 0.12); }
    .comment-user { font-size: 12px; color: var(--text-muted); }
    .comment-time { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .comment-text { font-size: 14px; color: var(--text); line-height: 1.65; }
    .comment-text-clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .comment-read-more { font-size: 12px; color: var(--accent); font-weight: bold; cursor: pointer; display: inline-block; }
    .comment-read-more:hover { text-decoration: underline; }

    /* Comment footer — holds "Read more" and "View on Reddit" */
    .comment-footer { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
    .comment-source-link { font-size: 12px; color: var(--text-muted); font-weight: 500; transition: color 0.15s; margin-left: auto; }
    .comment-source-link:hover { color: var(--accent); text-decoration: underline; }

    .comments-load-more { display: block; width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: bold; color: var(--text-dim); cursor: pointer; transition: all 0.15s; text-align: center; margin-top: 8px; }
    .comments-load-more:hover { border-color: var(--accent); color: var(--text); }

    .comments-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 14px; background: var(--surface); border: 1px dashed var(--border); border-radius: 14px; }

    /* States */
    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 15px; }
    .error { text-align: center; padding: 60px 20px; color: var(--negative); font-size: 15px; }

    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--accent); margin-bottom: 20px; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>

<script src="/shared/nav.js"></script>

<script type="module">
  // ─── SUPABASE CLIENT ───────────────────────────────────────
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://hrhhznjfpstwuxdlwyhz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SG22UKcXlKJcDlX0QfEOiQ__0sCg5Lc';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // ─── PARSE URL PATH ────────────────────────────────────────
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const categorySlug = pathParts[0] || '';
  const subcategorySlug = pathParts[1] || '';
  const productSlug = pathParts[2] || '';

  const prettyName = (s) =>
    s.replace(/-/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function timeAgo(d) {
    if (!d) return '';
    const ms = Date.now() - new Date(d).getTime();
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const dd = Math.floor(h / 24);
    if (dd < 7) return dd + 'd ago';
    if (dd < 30) return Math.floor(dd / 7) + 'w ago';
    return Math.floor(dd / 30) + 'mo ago';
  }

  // ─── BUILD BREADCRUMB ──────────────────────────────────────
  function renderBreadcrumb(productName) {
    document.getElementById('breadcrumb').innerHTML = `
      <a href="/">Home</a><span class="sep">›</span>
      <a href="/${categorySlug}/${subcategorySlug}">${prettyName(subcategorySlug)}</a><span class="sep">›</span>
      <span>${escapeHtml(productName)}</span>
    `;
  }

  // ─── GLOBAL STATE FOR COMMENTS ─────────────────────────────
  let allComments = [];
  let currentFilter = 'all';
  let visibleCount = 8;
  const COMMENTS_PER_PAGE = 8;

  // ─── FETCH PRODUCT ─────────────────────────────────────────
  async function fetchProduct() {
    if (!productSlug) {
      showError('No product specified in URL.');
      return;
    }

    try {
      const { data, error } = await supabase
        .from('products')
        .select('*')
        .eq('slug', productSlug)
        .limit(1);

      if (error) throw error;

      if (!data || data.length === 0) {
        showError('Product not found. It may have been removed or the URL is incorrect.');
        return;
      }

      const product = data[0];
      renderProduct(product);
      fetchRecommendations(product);
      fetchComments(product.name);

    } catch (err) {
      console.error('Fetch error:', err);
      showError('Something went wrong loading this product. Please try again.');
    }
  }

  // ─── RENDER PRODUCT ────────────────────────────────────────
  function renderProduct(p) {
    // Page title & meta
    document.getElementById('page-title').textContent =
      `${p.name} — ${prettyName(subcategorySlug)} | IndiaRecs`;
    document.getElementById('meta-description').content =
      p.description || `${p.name} by ${p.brand || 'Unknown'} — Reddit sentiment and reviews`;

    // Breadcrumb
    renderBreadcrumb(p.name);

    // Image (with fallback)
    const img = document.getElementById('product-img');
    if (p.image_url && !p.image_url.startsWith('data:')) {
      img.src = p.image_url;
    } else {
      img.style.display = 'none';
      img.parentElement.innerHTML = `
        <div style="width:200px;height:200px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:bold;color:white;background:linear-gradient(135deg,#ff6b35,#a855f7);">
          ${(p.name || '?').charAt(0).toUpperCase()}
        </div>`;
    }
    img.alt = p.name;

    // Text fields
    document.getElementById('product-name').textContent = p.name;
    document.getElementById('product-brand').textContent = p.brand ? `by ${p.brand}` : '';
    document.getElementById('product-price').textContent = p.price_inr ? `₹${p.price_inr}` : '';
    document.getElementById('product-description').textContent = p.description || '';

    // Tags
    const tagsEl = document.getElementById('product-tags');
    const tags = [];
    if (p.product_category) tags.push(p.product_category);
    if (p.skin_type) tags.push(p.skin_type + ' skin');
    if (p.tags && Array.isArray(p.tags)) tags.push(...p.tags);
    tagsEl.innerHTML = tags.map(t => `<span class="product-tag">${escapeHtml(t)}</span>`).join('');

    // ─── RETAILER: Amazon only, with affiliate tag ───────────
    const q = encodeURIComponent(p.name);

    // Use a direct affiliate URL from DB if available (for future PA-API integration),
    // otherwise fall back to Amazon search with your Associates tag
    const amazonUrl = p.affiliate_url
      ? p.affiliate_url
      : `https://www.amazon.in/s?k=${q}&tag=indiarecs-21`;

    document.getElementById('retailers-grid').innerHTML = `
      <a href="${amazonUrl}" target="_blank" rel="noopener" class="retailer-card">
        <div class="retailer-name">Amazon India</div>
        <div class="retailer-action">Check price →</div>
      </a>
    `;

    // Sentiment
    const total = p.mention_count || 0;
    const pos = p.positive_count || 0;
    const neg = p.negative_count || 0;
    const neu = Math.max(0, total - pos - neg);
    const denom = pos + neu + neg;

    if (denom > 0) {
      document.getElementById('sentiment-section').style.display = 'block';
      const posPct = Math.round((pos / denom) * 100);
      const neuPct = Math.round((neu / denom) * 100);
      const negPct = Math.round((neg / denom) * 100);
      document.getElementById('sentiment-bars').innerHTML = `
        <div class="sentiment-row">
          <span class="sentiment-emoji">👍</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill pos" style="width:${posPct}%"></div></div>
          <span class="sentiment-label"><strong>${pos}</strong> (${posPct}%)</span>
        </div>
        <div class="sentiment-row">
          <span class="sentiment-emoji">😐</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neu" style="width:${neuPct}%"></div></div>
          <span class="sentiment-label"><strong>${neu}</strong> (${neuPct}%)</span>
        </div>
        <div class="sentiment-row">
          <span class="sentiment-emoji">👎</span>
          <div class="sentiment-bar-wrap"><div class="sentiment-bar-fill neg" style="width:${negPct}%"></div></div>
          <span class="sentiment-label"><strong>${neg}</strong> (${negPct}%)</span>
        </div>
        <div style="margin-top:12px;font-size:12px;color:var(--text-muted);">
          Based on ${total} Reddit mention${total === 1 ? '' : 's'} from Indian communities
        </div>
      `;
    }

    // Pros & Cons
    const pros = (p.pros || '').split('\n').filter(x => x.trim());
    const cons = (p.cons || '').split('\n').filter(x => x.trim());

    if (pros.length > 0 || cons.length > 0) {
      document.getElementById('pros-cons-section').style.display = 'grid';
      document.getElementById('pros-list').innerHTML = pros.length > 0
        ? pros.map(item => `<div class="pc-item pro">${escapeHtml(item)}</div>`).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
      document.getElementById('cons-list').innerHTML = cons.length > 0
        ? cons.map(item => `<div class="pc-item con">${escapeHtml(item)}</div>`).join('')
        : '<div class="pc-empty">AI summary generating soon.</div>';
    }

    // Show content, hide loading
    document.getElementById('loading').style.display = 'none';
    document.getElementById('product-content').style.display = 'block';
  }

  // ─── FETCH COMMENTS FROM MENTIONS TABLE ────────────────────
  async function fetchComments(productName) {
    try {
      const { data, error } = await supabase
        .from('mentions')
        .select('*')
        .eq('product_name', productName)
        .order('created_at', { ascending: false });

      if (error) throw error;
      if (!data || data.length === 0) return;

      allComments = data;
      renderCommentsSection();

    } catch (err) {
      console.error('Comments fetch error:', err);
      // Fail silently — comments are non-critical
    }
  }

  // ─── RENDER COMMENTS SECTION ───────────────────────────────
  function renderCommentsSection() {
    if (allComments.length === 0) return;

    document.getElementById('comments-section').style.display = 'block';
    document.getElementById('comments-count').textContent =
      `${allComments.length} mention${allComments.length === 1 ? '' : 's'} found`;

    // Setup filter buttons
    setupCommentFilters();
    renderCommentsList();
  }

  function setupCommentFilters() {
    const filterBtns = document.querySelectorAll('.comment-filter-btn');
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        visibleCount = COMMENTS_PER_PAGE;
        renderCommentsList();
      });
    });
  }

  function getFilteredComments() {
    if (currentFilter === 'all') return allComments;
    return allComments.filter(c => (c.sentiment || '').toLowerCase() === currentFilter);
  }

  function renderCommentsList() {
    const filtered = getFilteredComments();
    const toShow = filtered.slice(0, visibleCount);
    const listEl = document.getElementById('comments-list');

    if (filtered.length === 0) {
      listEl.innerHTML = `
        <div class="comments-empty">
          No ${currentFilter} comments found for this product yet.
        </div>`;
      document.getElementById('comments-load-more').style.display = 'none';
      return;
    }

    listEl.innerHTML = toShow.map((c, i) => {
      const text = c.comment_text || '';
      const isLong = text.length > 280;
      const sentiment = (c.sentiment || 'neutral').toLowerCase();
      const sentimentLabel = sentiment === 'positive' ? '👍 Positive'
        : sentiment === 'negative' ? '👎 Negative'
        : '😐 Neutral';

      // "View on Reddit" link — only renders if reddit_url exists in DB
      const redditLink = c.reddit_url
        ? `<a href="${escapeHtml(c.reddit_url)}" target="_blank" rel="noopener" class="comment-source-link">View on Reddit ↗</a>`
        : '';

      return `
        <div class="comment-card">
          <div class="comment-meta">
            ${c.subreddit ? `<span class="comment-subreddit">r/${escapeHtml(c.subreddit)}</span>` : ''}
            <span class="comment-sentiment ${sentiment}">${sentimentLabel}</span>
            ${c.username && !c.username.startsWith('legacy_') ? `<span class="comment-user">u/${escapeHtml(c.username)}</span>` : ''}
            <span class="comment-time">${timeAgo(c.created_at)}</span>
          </div>
          <div class="comment-text ${isLong ? 'comment-text-clamped' : ''}" id="comment-text-${i}">
            ${escapeHtml(text)}
          </div>
          <div class="comment-footer">
            ${isLong ? `<span class="comment-read-more" onclick="toggleComment(${i}, this)">Read more</span>` : ''}
            ${redditLink}
          </div>
        </div>
      `;
    }).join('');

    // Show/hide load more button
    const loadMoreBtn = document.getElementById('comments-load-more');
    if (filtered.length > visibleCount) {
      loadMoreBtn.style.display = 'block';
      loadMoreBtn.textContent = `Show more comments (${filtered.length - visibleCount} remaining) ↓`;
    } else {
      loadMoreBtn.style.display = 'none';
    }
  }

  // Make toggle function globally available
  window.toggleComment = function(index, btn) {
    const el = document.getElementById(`comment-text-${index}`);
    if (el.classList.contains('comment-text-clamped')) {
      el.classList.remove('comment-text-clamped');
      btn.textContent = 'Show less';
    } else {
      el.classList.add('comment-text-clamped');
      btn.textContent = 'Read more';
    }
  };

  // Load more button handler
  document.getElementById('comments-load-more').addEventListener('click', () => {
    visibleCount += COMMENTS_PER_PAGE;
    renderCommentsList();
  });

  // ─── FETCH RECOMMENDATIONS ─────────────────────────────────
  async function fetchRecommendations(currentProduct) {
    try {
      const { data: recs, error } = await supabase
        .from('products')
        .select('name, slug, image_url, price_inr, category, product_category, brand')
        .eq('product_category', currentProduct.product_category || '')
        .neq('slug', productSlug)
        .order('score', { ascending: false })
        .limit(4);

      if (error || !recs || recs.length === 0) return;
      renderRecommendations(recs);
    } catch (err) {
      console.error('Recs fetch error:', err);
    }
  }

  // ─── RENDER RECOMMENDATIONS ────────────────────────────────
  function renderRecommendations(recs) {
    const grid = document.getElementById('recs-grid');

    grid.innerHTML = recs.map(rec => {
      const recUrl = `/${rec.category || categorySlug}/${subcategorySlug}/${rec.slug}`;
      const hasRealImage = rec.image_url && !rec.image_url.startsWith('data:');
      const imgHtml = hasRealImage
        ? `<img src="${rec.image_url}" alt="${escapeHtml(rec.name)}" />`
        : `<div style="width:80px;height:80px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;color:white;background:linear-gradient(135deg,#06b96f,#3b82f6);margin:0 auto 10px;">${(rec.name || '?').charAt(0).toUpperCase()}</div>`;

      return `
        <a href="${recUrl}" class="rec-card">
          ${imgHtml}
          <p class="rec-name">${escapeHtml(rec.name)}</p>
          <p class="rec-price">${rec.price_inr ? '₹' + rec.price_inr : ''}</p>
        </a>
      `;
    }).join('');

    document.getElementById('recs-section').style.display = 'block';
  }

  // ─── ERROR HANDLER ─────────────────────────────────────────
  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const errEl = document.getElementById('error');
    errEl.textContent = msg;
    errEl.style.display = 'block';
    renderBreadcrumb('Not Found');
  }

  // ─── INIT ──────────────────────────────────────────────────
  fetchProduct();
</script>
