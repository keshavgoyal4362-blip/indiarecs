<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Analysis — IndiaRecs</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet"/>

  <style>
    /* ✅ FIX: Scoped reset — excludes nav so nav.css isn't overridden */
    .page *, .page *::before, .page *::after,
    .breadcrumb *, .breadcrumb *::before, .breadcrumb *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d0f12;
      --surface: #141720;
      --surface2: #1b1f2e;
      --border: rgba(255,255,255,0.07);
      --border2: rgba(255,255,255,0.12);
      --text: #e8eaf0;
      --muted: #7a8099;
      --accent-green: #22d77f;
      --accent-yellow: #f5c542;
      --accent-red: #f0574f;
      --accent-blue: #5b8df6;
      --positive: #22d77f;
      --neutral: #f5c542;
      --negative: #f0574f;
      --pro-color: #22d77f;
      --con-color: #f0574f;
      --radius: 14px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* ✅ FIX: Removed the "nav { ... }" rule — let nav.css handle it entirely */

    /* BREADCRUMB */
    .breadcrumb {
      padding: 12px 28px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      flex-wrap: wrap;
    }
    .breadcrumb a { color: var(--muted); text-decoration: none; }
    .breadcrumb a:hover { color: var(--text); }
    .breadcrumb .sep { opacity: .4; }
    .breadcrumb .current { color: var(--text); }
    .bread-actions { margin-left: auto; display: flex; gap: 8px; }
    .bread-btn {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface); border: 1px solid var(--border2);
      color: var(--text); font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 5px 12px; border-radius: var(--radius-sm); cursor: pointer; transition: background .2s;
    }
    .bread-btn:hover { background: var(--surface2); }

    /* PAGE WRAPPER */
    .page { padding: 24px 28px 48px; max-width: 1340px; margin: 0 auto; }

    /* LOADING STATE */
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 400px; gap: 16px; color: var(--muted);
    }
    .loading-spinner {
      width: 40px; height: 40px; border: 3px solid var(--surface2);
      border-top-color: var(--accent-green); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ERROR STATE */
    .error-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 400px; gap: 12px; text-align: center;
    }
    .error-state h2 { font-family: 'Sora', sans-serif; font-size: 22px; color: #fff; }
    .error-state p { color: var(--muted); font-size: 14px; max-width: 400px; }
    .error-state a {
      margin-top: 8px; padding: 10px 20px; background: var(--accent-green);
      color: #000; font-weight: 600; border-radius: var(--radius-sm); text-decoration: none;
    }

    /* HERO ROW */
    .hero { display: grid; grid-template-columns: 360px 1fr 260px; gap: 16px; margin-bottom: 16px; }

    .hero-image {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      min-height: 240px; overflow: hidden; position: relative;
    }
    .hero-image img { max-width: 170px; max-height: 200px; object-fit: contain; filter: drop-shadow(0 8px 32px rgba(0,0,0,.5)); }
    .hero-image .fallback-icon {
      width: 120px; height: 120px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 56px; font-weight: 700; color: #fff;
    }

    .hero-info {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 24px 28px; display: flex; flex-direction: column; gap: 12px;
    }
    .top-rated-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(34,215,127,0.12); border: 1px solid rgba(34,215,127,0.25);
      color: var(--accent-green); font-size: 11px; font-weight: 700;
      letter-spacing: .04em; padding: 4px 10px; border-radius: 20px; width: fit-content;
    }
    .hero-title { font-family: 'Sora', sans-serif; font-size: 26px; font-weight: 700; color: #fff; line-height: 1.2; }
    .hero-brand { color: var(--muted); font-size: 13px; margin-top: -6px; }
    .hero-tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 20px; }
    .hero-desc { color: #b0b8cc; font-size: 14px; line-height: 1.65; }
    .hero-meta {
      display: flex; align-items: center; gap: 14px;
      margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border);
    }
    .meta-reviews { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
    .dot-green { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; flex-shrink: 0; }
    .meta-source { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); }
    .reddit-dot {
      width: 18px; height: 18px; background: #ff4500; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: #fff; font-weight: 700;
    }

    .hero-score {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 28px 24px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 8px;
    }
    .score-label { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .score-number { font-family: 'Sora', sans-serif; font-size: 64px; font-weight: 700; color: var(--accent-green); line-height: 1; letter-spacing: -2px; }
    .score-sentiment { font-size: 15px; font-weight: 600; color: var(--accent-green); }
    .score-based { font-size: 12px; color: var(--muted); }
    .score-bar { width: 100%; height: 6px; background: var(--surface2); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .score-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-green), #7ef4b8); border-radius: 3px; transition: width 1s cubic-bezier(.4,0,.2,1); }

    /* SECOND ROW */
    .second-row { display: grid; grid-template-columns: 240px 300px 1fr 1fr; gap: 16px; margin-bottom: 16px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-title { font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }

    /* SENTIMENT BREAKDOWN */
    .sentiment-row { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .sent-item { display: flex; align-items: center; gap: 10px; }
    .sent-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .sent-label { font-size: 13px; color: var(--text); width: 56px; }
    .sent-bar-wrap { flex: 1; height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
    .sent-bar { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(.4,0,.2,1); }
    .sent-pct { font-size: 12px; color: var(--muted); width: 44px; text-align: right; white-space: nowrap; }
    .sent-total { font-size: 12px; color: var(--muted); margin-top: 4px; }

    /* QUICK OVERVIEW */
    .overview-list { display: flex; flex-direction: column; gap: 8px; }
    .overview-item { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #c5c9d8; }
    .ov-icon { font-size: 14px; margin-top: 1px; flex-shrink: 0; }
    .ov-neg { color: #f0574f; }
    .ov-pos { color: #22d77f; }

    /* PROS / CONS */
    .pros-cons-list { display: flex; flex-direction: column; gap: 10px; }
    .pc-item { display: flex; flex-direction: column; gap: 2px; }
    .pc-label { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; }
    .pc-label.pro { color: var(--pro-color); }
    .pc-label.con { color: var(--con-color); }
    .pc-mentions { font-size: 11px; color: var(--muted); margin-left: 20px; }

    /* REVIEWS ROW */
    .reviews-section { margin-bottom: 16px; }
    .reviews-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
    .reviews-header h2 { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: #fff; }
    .reviews-header p { font-size: 12px; color: var(--muted); }
    .reviews-count { font-size: 13px; color: var(--muted); }
    .review-filters { display: flex; gap: 8px; align-items: center; }
    .filter-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2); border: 1px solid var(--border2);
      color: var(--text); font-family: inherit; font-size: 12px; font-weight: 500;
      padding: 5px 12px; border-radius: 20px; cursor: pointer; transition: all .2s;
    }
    .filter-chip.active { background: rgba(34,215,127,0.12); border-color: rgba(34,215,127,0.3); color: var(--accent-green); }
    .filter-chip:hover { background: var(--surface2); }

    .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }

    .review-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px; display: flex; flex-direction: column; gap: 10px;
    }
    .rv-top { display: flex; align-items: center; justify-content: space-between; }
    .rv-source { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .rv-dot { width: 7px; height: 7px; border-radius: 50%; }
    .rv-sentiment { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 20px; }
    .rv-sentiment.positive { background: rgba(34,215,127,0.14); color: var(--positive); }
    .rv-sentiment.neutral { background: rgba(245,197,66,0.14); color: var(--neutral); }
    .rv-sentiment.negative { background: rgba(240,87,79,0.14); color: var(--negative); }
    .rv-text { font-size: 13px; color: #b8bdd0; line-height: 1.6; }
    .rv-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; }
    .rv-upvotes { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }

    /* RECOMMENDATIONS */
    .rec-section { margin-top: 16px; }
    .rec-title { font-family: 'Sora', sans-serif; font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 14px; }
    .rec-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .rec-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; display: flex; gap: 12px; cursor: pointer; transition: border-color .2s, background .2s;
      text-decoration: none;
    }
    .rec-card:hover { border-color: var(--border2); background: var(--surface2); }
    .rec-img {
      width: 52px; height: 52px; background: var(--surface2); border-radius: var(--radius-sm);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .rec-info { flex: 1; min-width: 0; }
    .rec-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
    .rec-reviews { font-size: 11px; color: var(--muted); }

    /* RESPONSIVE */
    @media (max-width: 1200px) {
      .hero { grid-template-columns: 280px 1fr 220px; }
      .second-row { grid-template-columns: 1fr 1fr; }
      .rec-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      .page { padding: 16px 14px 32px; }
      .breadcrumb { padding: 10px 14px; }
      .hero { grid-template-columns: 1fr; }
      .hero-image { min-height: 180px; }
      .second-row { grid-template-columns: 1fr; }
      .reviews-grid { grid-template-columns: 1fr; }
      .rec-grid { grid-template-columns: 1fr; }
      .hero-title { font-size: 22px; }
      .score-number { font-size: 48px; }
      .bread-actions { display: none; }
    }

    /* ANIMATIONS */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .hero { animation: fadeUp .5s ease both; }
    .second-row { animation: fadeUp .5s .1s ease both; }
    .reviews-section { animation: fadeUp .5s .2s ease both; }
    .rec-section { animation: fadeUp .5s .3s ease both; }
  </style>

  <!-- ✅ FIX: nav.css loaded AFTER page styles so it wins on specificity for nav elements -->
  <link rel="stylesheet" href="/shared/nav.css"/>
</head>
<body>

<!-- SHARED NAV -->
<nav id="mainNav"></nav>

<!-- BREADCRUMB (populated dynamically) -->
<div class="breadcrumb" id="breadcrumb">
  <a href="/">Home</a><span class="sep">›</span>
  <a href="/">Skincare</a><span class="sep">›</span>
  <span class="current" id="breadcrumbProduct">Loading...</span>
  <div class="bread-actions">
    <button class="bread-btn" onclick="shareProduct()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Share
    </button>
    <button class="bread-btn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      Save
    </button>
  </div>
</div>

<!-- PAGE CONTENT (injected by JS) -->
<div class="page" id="pageContent">
  <div class="loading-state">
    <div class="loading-spinner"></div>
    <p>Loading product analysis...</p>
  </div>
</div>

<!-- SHARED NAV LOADER -->
<div id="mobileMenuContainer"></div>
<script src="/shared/nav.js"></script>

<script type="module">

  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://hrhhznjfpstwuxdlwyhz.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_SG22UKcXlKJcDlX0QfEOiQ__0sCg5Lc';
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Extract slug from URL path: /product/cetaphil-gentle-cleanser → cetaphil-gentle-cleanser
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  const slug = pathParts[pathParts.length - 1] || '';

  if (!slug) {
    showError('No product specified', 'Please navigate to a product from the comparison page.');
  } else {
    loadProduct(slug);
  }

  async function loadProduct(slug) {
    try {
      // 1. Fetch product by slug
      const { data: product, error: prodErr } = await supabase
        .from('products')
        .select('*')
        .eq('slug', slug)
        .single();

      if (prodErr || !product) {
        showError('Product not found', `We couldn't find a product with the URL "${slug}". It may have been removed or the link is incorrect.`);
        return;
      }

      // 2. Fetch pros, cons, overview from product_pros_cons
      const { data: prosConsData } = await supabase
        .from('product_pros_cons')
        .select('*')
        .eq('product_id', product.id)
        .order('mention_count', { ascending: false });

      // 3. Fetch mentions for this product
      const { data: mentions } = await supabase
        .from('mentions')
        .select('*')
        .eq('product_name', product.name)
        .order('created_at', { ascending: false });

      // 4. Fetch related products (same category, excluding this one)
      const { data: related } = await supabase
        .from('products')
        .select('*')
        .eq('product_category', product.product_category)
        .neq('id', product.id)
        .order('score', { ascending: false })
        .limit(4);

      // 5. Render everything
      renderPage(product, prosConsData || [], mentions || [], related || []);

    } catch (err) {
      console.error('Load error:', err);
      showError('Something went wrong', 'Please try refreshing the page.');
    }
  }

  function renderPage(product, prosConsData, mentions, related) {
    const pos = product.positive_count || 0;
    const neg = product.negative_count || 0;
    const total = product.mention_count || 0;
    const neu = Math.max(0, total - pos - neg);
    const denom = pos + neu + neg || 1;
    const posPct = Math.round((pos / denom) * 100);
    const neuPct = Math.round((neu / denom) * 100);
    const negPct = Math.round((neg / denom) * 100);

    // Separate pros, cons, overview
    const pros = prosConsData.filter(x => x.type === 'pro');
    const cons = prosConsData.filter(x => x.type === 'con');
    const overview = prosConsData.filter(x => x.type === 'overview');

    // Determine sentiment label & color
    let sentLabel = 'Positive';
    let sentColor = 'var(--accent-green)';
    if (posPct < 50) { sentLabel = 'Mixed'; sentColor = 'var(--accent-yellow)'; }
    if (negPct > posPct) { sentLabel = 'Negative'; sentColor = 'var(--accent-red)'; }

    // Determine rank (use score or default)
    const rankNum = product.rank || 1;

    // Update page title & breadcrumb
    document.title = `${esc(product.name)} — Analysis | IndiaRecs`;
    document.getElementById('breadcrumbProduct').textContent = product.name;

    // Build hero image
    const heroImg = product.image_url
      ? `<img src="${esc(product.image_url)}" alt="${esc(product.name)}" onerror="this.style.display='none'; this.parentElement.innerHTML += '<div class=\\'fallback-icon\\' style=\\'background:linear-gradient(135deg,#ff6b35,#a855f7)\\'>${esc(product.name).charAt(0)}</div>'"/>`
      : `<div class="fallback-icon" style="background:linear-gradient(135deg,#ff6b35,#a855f7)">${esc(product.name).charAt(0)}</div>`;

    // Build overview items (mix of pos overview + cons as negatives)
    let overviewHtml = '';
    overview.forEach(item => {
      overviewHtml += `<div class="overview-item"><span class="ov-icon ov-pos">✓</span> ${esc(item.text)}</div>`;
    });
    // Add top cons as negative overview items
    cons.slice(0, 2).forEach(item => {
      overviewHtml += `<div class="overview-item"><span class="ov-icon ov-neg">–</span> ${esc(item.text)}</div>`;
    });
    if (!overviewHtml) {
      overviewHtml = '<div style="color:var(--muted);font-size:12px;">Overview generating from Reddit mentions...</div>';
    }

    // Build pros HTML
    let prosHtml = pros.length > 0
      ? pros.map(p => `
          <div class="pc-item">
            <div class="pc-label pro"><span>✓</span> ${esc(p.text)}</div>
            ${p.mention_count > 0 ? `<div class="pc-mentions">Mentioned in ${p.mention_count} reviews</div>` : ''}
          </div>`).join('')
      : '<div style="color:var(--muted);font-size:12px;">Pros generating from Reddit data...</div>';

    // Build cons HTML
    let consHtml = cons.length > 0
      ? cons.map(c => `
          <div class="pc-item">
            <div class="pc-label con"><span>✕</span> ${esc(c.text)}</div>
            ${c.mention_count > 0 ? `<div class="pc-mentions">Mentioned in ${c.mention_count} reviews</div>` : ''}
          </div>`).join('')
      : '<div style="color:var(--muted);font-size:12px;">Cons generating from Reddit data...</div>';

    // Build reviews HTML
    let reviewsHtml = '';
    const displayMentions = mentions.slice(0, 6);
    if (displayMentions.length > 0) {
      reviewsHtml = displayMentions.map(m => {
        const sent = (m.sentiment || '').toLowerCase();
        const sentClass = sent === 'positive' ? 'positive' : sent === 'negative' ? 'negative' : 'neutral';
        const sentText = sent.charAt(0).toUpperCase() + sent.slice(1) || 'Neutral';
        return `
          <div class="review-card">
            <div class="rv-top">
              <div class="rv-source">
                <div class="rv-dot" style="background:#ff4500;"></div>
                r/${esc(m.subreddit || 'Reddit')} · ${timeAgo(m.created_at)}
              </div>
              <span class="rv-sentiment ${sentClass}">${sentText}</span>
            </div>
            <div class="rv-text">${esc(m.comment_text || m.title || 'No text available')}</div>
            <div class="rv-footer">
              <div class="rv-upvotes">${m.upvotes ? `▲ ${m.upvotes} upvotes` : ''}</div>
            </div>
          </div>`;
      }).join('');
    } else {
      reviewsHtml = `
        <div class="review-card" style="grid-column:1/-1;text-align:center;padding:40px;">
          <div style="font-size:32px;margin-bottom:8px;">💬</div>
          <div style="color:var(--muted);font-size:13px;">No individual reviews loaded yet. Check back as we index more Reddit threads.</div>
        </div>`;
    }

    // Build recommendations HTML
    const icons = ['🧴', '💧', '🌿', '🫧'];
    let recHtml = related.length > 0
      ? related.map((r, i) => `
          <a href="/product/${esc(r.slug)}" class="rec-card">
            <div class="rec-img">${icons[i % icons.length]}</div>
            <div class="rec-info">
              <div class="rec-name">${esc(r.name)}</div>
              <div class="rec-reviews">${r.mention_count || 0} mentions · ${r.positive_count ? Math.round((r.positive_count / (r.mention_count || 1)) * 100) + '% positive' : 'No data yet'}</div>
            </div>
          </a>`).join('')
      : '<div style="color:var(--muted);font-size:13px;grid-column:1/-1;text-align:center;padding:24px;">No related products found yet.</div>';

    // Assemble full page
    document.getElementById('pageContent').innerHTML = `
      <!-- HERO ROW -->
      <div class="hero">
        <div class="hero-image">${heroImg}</div>
        <div class="hero-info">
          <div class="top-rated-chip">✦ #${rankNum} Top Rated ${esc(product.product_category || 'Product')}</div>
          <div class="hero-title">${esc(product.name)}</div>
          ${product.brand ? `<div class="hero-brand">${esc(product.brand)}</div>` : ''}
          <div class="hero-tags">
            ${product.product_category ? `<span class="tag">${esc(product.product_category)}</span>` : ''}
            ${product.skin_type ? `<span class="tag">${esc(product.skin_type)}</span>` : '<span class="tag">All Skin Types</span>'}
          </div>
          <div class="hero-desc">${esc(product.description || `Analysis of ${product.name} based on real Reddit discussions from Indian skincare communities.`)}</div>
          <div class="hero-meta">
            <div class="meta-reviews">
              <div class="dot-green"></div>
              ${total} Review${total === 1 ? '' : 's'}
            </div>
            <span style="color:var(--border2)">|</span>
            <div class="meta-source">
              <div class="reddit-dot">r</div>
              Reddit Communities
            </div>
          </div>
        </div>
        <div class="hero-score">
          <div class="score-label">% Positive Score</div>
          <div class="score-number" style="color:${sentColor}">${posPct}%</div>
          <div class="score-sentiment" style="color:${sentColor}">${sentLabel} Sentiment</div>
          <div class="score-based">Based on ${total} reviews</div>
          <div class="score-bar"><div class="score-bar-fill" id="scoreBarFill" style="width:0%"></div></div>
        </div>
      </div>

      <!-- SECOND ROW -->
      <div class="second-row">
        <!-- Sentiment Breakdown -->
        <div class="card">
          <div class="card-title">Sentiment Breakdown</div>
          <div class="card-sub">How people feel about this product</div>
          <div class="sentiment-row">
            <div class="sent-item">
              <div class="sent-dot" style="background:var(--positive)"></div>
              <div class="sent-label">Positive</div>
              <div class="sent-bar-wrap"><div class="sent-bar" id="sentPos" style="width:0%;background:var(--positive)"></div></div>
              <div class="sent-pct">${pos} (${posPct}%)</div>
            </div>
            <div class="sent-item">
              <div class="sent-dot" style="background:var(--neutral)"></div>
              <div class="sent-label">Neutral</div>
              <div class="sent-bar-wrap"><div class="sent-bar" id="sentNeu" style="width:0%;background:var(--neutral)"></div></div>
              <div class="sent-pct">${neu} (${neuPct}%)</div>
            </div>
            <div class="sent-item">
              <div class="sent-dot" style="background:var(--negative)"></div>
              <div class="sent-label">Negative</div>
              <div class="sent-bar-wrap"><div class="sent-bar" id="sentNeg" style="width:0%;background:var(--negative)"></div></div>
              <div class="sent-pct">${neg} (${negPct}%)</div>
            </div>
          </div>
          <div class="sent-total">${total} total reviews</div>
        </div>

        <!-- Quick Overview -->
        <div class="card">
          <div class="card-title">Quick Overview</div>
          <div class="card-sub"> </div>
          <div class="overview-list">${overviewHtml}</div>
        </div>

        <!-- Top Pros -->
        <div class="card">
          <div class="card-title" style="color:var(--pro-color)">Top Pros</div>
          <div class="card-sub"> </div>
          <div class="pros-cons-list">${prosHtml}</div>
        </div>

        <!-- Top Cons -->
        <div class="card">
          <div class="card-title" style="color:var(--con-color)">Top Cons</div>
          <div class="card-sub"> </div>
          <div class="pros-cons-list">${consHtml}</div>
        </div>
      </div>

      <!-- REVIEWS SECTION -->
      <div class="reviews-section">
        <div class="reviews-header">
          <div>
            <h2>What People Are Saying</h2>
            <p>Real reviews from Reddit communities</p>
          </div>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div class="review-filters">
              <button class="filter-chip active" data-filter="all">All ${total}</button>
              <button class="filter-chip" data-filter="positive">👍 ${pos}</button>
              <button class="filter-chip" data-filter="neutral">😐 ${neu}</button>
              <button class="filter-chip" data-filter="negative">👎 ${neg}</button>
            </div>
          </div>
        </div>
        <div class="reviews-grid" id="reviewsGrid">${reviewsHtml}</div>
      </div>

      <!-- RECOMMENDATIONS -->
      <div class="rec-section">
        <div class="rec-title">You might also like</div>
        <div class="rec-grid">${recHtml}</div>
      </div>
    `;

    // Animate bars after render
    setTimeout(() => {
      const scoreBar = document.getElementById('scoreBarFill');
      if (scoreBar) scoreBar.style.width = posPct + '%';
      const sp = document.getElementById('sentPos');
      const sn = document.getElementById('sentNeu');
      const sng = document.getElementById('sentNeg');
      if (sp) sp.style.width = posPct + '%';
      if (sn) sn.style.width = neuPct + '%';
      if (sng) sng.style.width = negPct + '%';
    }, 300);

    // Filter chip functionality
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        filterReviews(btn.dataset.filter, mentions);
      });
    });
  }

  function filterReviews(filter, mentions) {
    const grid = document.getElementById('reviewsGrid');
    if (!grid) return;

    let filtered = mentions;
    if (filter !== 'all') {
      filtered = mentions.filter(m => (m.sentiment || '').toLowerCase() === filter);
    }

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="review-card" style="grid-column:1/-1;text-align:center;padding:40px;">
        <div style="color:var(--muted);font-size:13px;">No ${filter} reviews found.</div>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.slice(0, 6).map(m => {
      const sent = (m.sentiment || '').toLowerCase();
      const sentClass = sent === 'positive' ? 'positive' : sent === 'negative' ? 'negative' : 'neutral';
      const sentText = sent.charAt(0).toUpperCase() + sent.slice(1) || 'Neutral';
      return `
        <div class="review-card">
          <div class="rv-top">
            <div class="rv-source">
              <div class="rv-dot" style="background:#ff4500;"></div>
              r/${esc(m.subreddit || 'Reddit')} · ${timeAgo(m.created_at)}
            </div>
            <span class="rv-sentiment ${sentClass}">${sentText}</span>
          </div>
          <div class="rv-text">${esc(m.comment_text || m.title || 'No text available')}</div>
          <div class="rv-footer">
            <div class="rv-upvotes">${m.upvotes ? `▲ ${m.upvotes} upvotes` : ''}</div>
          </div>
        </div>`;
    }).join('');
  }

  function showError(title, message) {
    document.getElementById('pageContent').innerHTML = `
      <div class="error-state">
        <div style="font-size:48px;">🔍</div>
        <h2>${title}</h2>
        <p>${message}</p>
        <a href="/">← Back to Home</a>
      </div>`;
    document.getElementById('breadcrumbProduct').textContent = 'Not Found';
    document.title = 'Product Not Found — IndiaRecs';
  }

  // Utility functions
  function esc(str) {
    return String(str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function timeAgo(d) {
    if (!d) return 'recently';
    const ms = Date.now() - new Date(d).getTime();
    const m = Math.floor(ms / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const dd = Math.floor(h / 24);
    if (dd < 7) return dd + 'd ago';
    const w = Math.floor(dd / 7);
    if (w < 5) return w + 'w ago';
    return Math.floor(dd / 30) + 'mo ago';
  }

  // Share functionality
  window.shareProduct = function() {
    if (navigator.share) {
      navigator.share({ title: document.title, url: window.location.href });
    } else {
      navigator.clipboard.writeText(window.location.href);
      alert('Link copied to clipboard!');
    }
  };
</script>

</body>
</html>
