name: Generate Pros Cons

on:
  # Run automatically after scraper completes
  workflow_run:
    workflows: ["Run Scraper"]  # Must match your scraper workflow's name exactly
    types:
      - completed

  # Daily backup run (in case scraper didn't trigger, or you added products manually)
  schedule:
    - cron: '30 3 * * *'  # 3:30 AM UTC daily (9:00 AM IST)

  # Manual trigger still available
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    # Only run after scraper if it succeeded (skip if scraper failed)
    if: |
      github.event_name != 'workflow_run' || 
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python generate_pros_cons.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
