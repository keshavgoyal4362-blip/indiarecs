# Code Generated by Sidekick is for learning and experimentation purposes only.
name: Run IndiaRecs Scraper

on:
  schedule:
    - cron: '0 2 * * 1'  # every Monday at 2am UTC (7:30am IST Monday)
  workflow_dispatch:       # allows manual run from GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}   # ← ADDED
          GOOGLE_CX: ${{ secrets.GOOGLE_CX }}             # ← ADDED
        run: python scraper.py
